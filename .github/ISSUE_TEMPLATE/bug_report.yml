name: Bug report
description: Report an incorrect graph, crash, or Viewer problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Describe the actual and expected result. Do not attach proprietary source or secrets.
    validations:
      required: true
  - type: input
    attributes:
      label: Agent Runtime Map version
    validations:
      required: true
  - type: input
    attributes:
      label: Node.js version and framework
    validations:
      required: true
  - type: textarea
    attributes:
      label: Minimal reproduction
      description: Link a public repository or paste a minimal synthetic example.
