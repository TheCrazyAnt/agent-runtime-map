<svg xmlns="http://www.w3.org/2000/svg" width="1270" height="760" viewBox="0 0 1270 760" role="img" aria-label="Install once and keep the Agent Map current from GitHub">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#dbe7f8" stroke-width="1" opacity="0.7"/>
    </pattern>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#bfd3f2"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#31558e" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1768ff"/>
    </marker>
    <marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#0aa88f"/>
    </marker>
    <marker id="arrow-purple" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#7047eb"/>
    </marker>
  </defs>
  <rect width="1270" height="760" fill="#f8fbff"/>
  <rect width="1270" height="760" fill="url(#grid)" opacity="0.76"/>
    <g transform="translate(52 44) scale(1.0416666666666667)">
    <rect width="48" height="48" rx="13" fill="#1768ff"/>
    <path d="M14 31 L24 17 L35 31" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="14" cy="31" r="4" fill="white"/><circle cx="24" cy="17" r="4" fill="white"/><circle cx="35" cy="31" r="4" fill="white"/>
  </g>
    <text x="122" y="78" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="800" fill="#0b1739" text-anchor="start">Agent Runtime Map</text>
    <text x="52" y="150" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="41" font-weight="850" fill="#0b1739" text-anchor="start">Install once. Every code change updates the map.</text>
    <text x="52" y="194" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="500" fill="#5d6f91" text-anchor="start">A read-only GitHub Action rebuilds, verifies, compares, and preserves the last good map.</text>
    <g><rect x="52" y="274" width="250" height="148" rx="22" fill="#ffffff" stroke="#1768ff" stroke-width="2.5" filter="url(#shadow)"/><text x="80" y="314" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="850" fill="#1768ff" text-anchor="start">01</text><text x="80" y="356" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#0b1739" text-anchor="start">Push or PR</text><text x="80" y="388" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="550" fill="#5d6f91" text-anchor="start">Source changes</text></g>
    <path d="M302 348 H346 V348 H390" fill="none" stroke="#1768ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
    <g><rect x="394" y="274" width="250" height="148" rx="22" fill="#ffffff" stroke="#1768ff" stroke-width="2.5" filter="url(#shadow)"/><text x="422" y="314" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="850" fill="#1768ff" text-anchor="start">02</text><text x="422" y="356" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#0b1739" text-anchor="start">Analyze</text><text x="422" y="388" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="550" fill="#5d6f91" text-anchor="start">No project execution</text></g>
    <path d="M644 348 H688 V348 H732" fill="none" stroke="#1768ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-blue)"/>
    <g><rect x="736" y="274" width="250" height="148" rx="22" fill="#ffffff" stroke="#0aa88f" stroke-width="2.5" filter="url(#shadow)"/><text x="764" y="314" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="850" fill="#0aa88f" text-anchor="start">03</text><text x="764" y="356" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#0b1739" text-anchor="start">Verify</text><text x="764" y="388" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="550" fill="#5d6f91" text-anchor="start">Map-only artifact</text></g>
    <path d="M986 348 H994 V348 H1002" fill="none" stroke="#0aa88f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
    <g><rect x="1010" y="274" width="250" height="148" rx="22" fill="#ffffff" stroke="#7047eb" stroke-width="2.5" filter="url(#shadow)"/><text x="1038" y="314" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="850" fill="#7047eb" text-anchor="start">04</text><text x="1038" y="356" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#0b1739" text-anchor="start">Publish</text><text x="1038" y="388" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="550" fill="#5d6f91" text-anchor="start">Private by default</text></g>
    <rect x="52" y="472" width="1166" height="148" rx="20" fill="#f3f7ff" stroke="#c8d8f2" stroke-width="2"/>
    <text x="78" y="510" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="800" fill="#1768ff" text-anchor="start">WHAT CHANGED</text>
    <g><rect x="78" y="538" width="120" height="38" rx="19" fill="#ffffff" stroke="#0aa88f" stroke-width="1.5"/><text x="138" y="563" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#0aa88f" text-anchor="middle">+3 nodes</text></g>
    <g><rect x="212" y="538" width="120" height="38" rx="19" fill="#ffffff" stroke="#1768ff" stroke-width="1.5"/><text x="272" y="563" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#1768ff" text-anchor="middle">+2 routes</text></g>
    <g><rect x="346" y="538" width="188" height="38" rx="19" fill="#ffffff" stroke="#7047eb" stroke-width="1.5"/><text x="440" y="563" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#7047eb" text-anchor="middle">1 diagnostic resolved</text></g>
    <text x="574" y="562" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#0b1739" text-anchor="start">Last successful map is preserved when analysis fails</text>
    <line x1="44" y1="674" x2="1226" y2="674" stroke="#c8d8f2"/>
    <text x="48" y="712" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#0aa88f" text-anchor="start">● contents: read · signed npm provenance</text>
    <text x="1222" y="712" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#5d6f91" text-anchor="end">Private artifact · Optional Pages demo</text>
    </svg>