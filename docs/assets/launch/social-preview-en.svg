<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="See how your Agent actually runs">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#dbe7f8" stroke-width="1" opacity="0.7"/>
    </pattern>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#bfd3f2"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#31558e" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#1768ff"/>
    </marker>
    <marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#0aa88f"/>
    </marker>
    <marker id="arrow-purple" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#7047eb"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="#f8fbff"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.76"/>
    <g transform="translate(62 60) scale(1.2083333333333333)">
    <rect width="48" height="48" rx="13" fill="#1768ff"/>
    <path d="M14 31 L24 17 L35 31" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="14" cy="31" r="4" fill="white"/><circle cx="24" cy="17" r="4" fill="white"/><circle cx="35" cy="31" r="4" fill="white"/>
  </g>
    <text x="137" y="101" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="31" font-weight="800" fill="#0b1739" text-anchor="start">Agent Runtime Map</text>
    <text x="64" y="184" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="850" fill="#0b1739" text-anchor="start"><tspan x="64" dy="0">See your Agent</tspan><tspan x="64" dy="52">actually run</tspan></text>
    <text x="64" y="306" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="500" fill="#5d6f91" text-anchor="start"><tspan x="64" dy="0">Code decides the topology.</tspan><tspan x="64" dy="31">Every step keeps file:line evidence.</tspan></text>
    <g><rect x="64" y="406" width="142" height="38" rx="19" fill="#ffffff" stroke="#1768ff" stroke-width="1.5"/><text x="135" y="431" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#1768ff" text-anchor="middle">Static analysis</text></g>
    <g><rect x="216" y="406" width="142" height="38" rx="19" fill="#ffffff" stroke="#0aa88f" stroke-width="1.5"/><text x="287" y="431" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#0aa88f" text-anchor="middle">Step-through</text></g>
    <g><rect x="64" y="454" width="142" height="38" rx="19" fill="#ffffff" stroke="#7047eb" stroke-width="1.5"/><text x="135" y="479" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#7047eb" text-anchor="middle">Bilingual</text></g>
    <g><rect x="216" y="454" width="142" height="38" rx="19" fill="#ffffff" stroke="#1768ff" stroke-width="1.5"/><text x="287" y="479" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#1768ff" text-anchor="middle">Open source</text></g>
    <text x="64" y="570" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="650" fill="#5d6f91" text-anchor="start">github.com/TheCrazyAnt/agent-runtime-map</text>
    <g>
